name: Security Audit
# Dependabot が pnpm 11 に未対応の間の代替チェック
# 既知の脆弱性は pnpm-workspace.yaml の audit.ignore で除外し、新規検出時のみ失敗させる
# トリガー設定
on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 9:00（JST）
  workflow_dispatch: # Actionsタブから手動実行
# 権限の最小化（デフォルトで全権限を無効化）
permissions: {}
jobs:
  Audit:
    name: pnpm audit (${{ matrix.branch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # リポジトリのチェックアウト
      issues: write # 脆弱性検出時のIssue作成・コメント
    strategy:
      fail-fast: false # 片方が失敗してももう片方を実行
      matrix:
        # Dependabotのアラートはデフォルトブランチのみが対象のため、WPブランチも明示的にチェック
        branch:
          - main
          - feature/update-wp
    steps:
      # リポジトリのチェックアウト
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ matrix.branch }}
          persist-credentials: false

      # Node.jsのセットアップ
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      # pnpmのインストール（ローカルと同じバージョン）
      - name: Install pnpm
        run: npm install -g pnpm@11.28.8

      # 脆弱性チェック（lockfileのみを参照するため依存のインストールは不要）
      # shell: bash を明示して pipefail を有効にし、tee を挟んでも audit の失敗を検知する
      - name: Run pnpm audit
        id: audit
        shell: bash
        run: pnpm audit --audit-level=moderate 2>&1 | tee audit-result.txt

      # 脆弱性検出時にIssueを作成（同じブランチの未解決Issueがあればコメントを追加）
      - name: Report to issue
        if: failure() && steps.audit.outcome == 'failure'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ matrix.branch }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="[security] pnpm audit で脆弱性を検出（${BRANCH}）"
          {
            echo "\`${BRANCH}\` ブランチで \`pnpm audit\` が新しい脆弱性を検出しました。"
            echo ""
            echo "- 実行ログ: ${RUN_URL}"
            echo "- 対応: \`pnpm update --depth Infinity --lockfile-only\` で範囲内更新 → 解消しないものは親パッケージの更新を検討"
            echo "- 修正版がない・親の更新待ちの場合は \`pnpm-workspace.yaml\` の \`audit.ignore\` に理由付きで追加"
            echo ""
            echo "<details><summary>pnpm audit の結果</summary>"
            echo ""
            echo '```'
            # Issue本文の上限（65,536文字）を超えないよう切り詰める
            head -c 60000 audit-result.txt
            echo '```'
            echo ""
            echo "</details>"
          } > issue-body.md
          number=$(gh issue list --state open --limit 100 --json number,title \
            | jq -r --arg t "$title" '.[] | select(.title == $t) | .number' | head -n 1)
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file issue-body.md
          else
            gh issue create --title "$title" --body-file issue-body.md
          fi
